{% set version = "0.2.1" %}

package:
  name: hydrofunctions
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/hydrofunctions/hydrofunctions-{{ version }}.tar.gz
  sha256: 187a170a3154c37439a2dc9aa3df6dac1e111fbe221164ee94cd0afd4af7c032

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - matplotlib-base 
    - ipython
    - numpy >=1.16.0
    - pandas
    - pyarrow
    - python >={{ python_min }}
    - requests

test:
  imports:
    - hydrofunctions
  requires:
    - coverage
    - python {{ python_min }}
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mroberge/hydrofunctions
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A suite of convenience functions for exploring water data in a Jupyter Notebook

extra:
  recipe-maintainers:
    - ocefpaf
