{% set name = "hydrofunctions" %}
{% set version = "0.2.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hydrofunctions-{{ version }}.tar.gz
  sha256: 4cfd7ef59d62206d71c36309020a201e3a37d0604e9f41a991880310be4cc0d6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - importlib-metadata
    - matplotlib-base
    - numpy >=1.16.0
    - pandas >=2
    - requests
    - ipython
    - pyarrow

test:
  imports:
    - hydrofunctions
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mroberge/hydrofunctions
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A suite of convenience functions for exploring water data in a Jupyter Notebook

extra:
  recipe-maintainers:
    - ocefpaf
